name: validate-eafc-package

# The EA FC 27 package in `mods/` is generated, so nothing in the Rust test suite
# touches it by default. This job is what actually answers "does it load?": it
# builds the authoring CLI, validates the package with the loader's own
# `validate_package`, packs and re-validates the archive, then builds a world from
# it in `tests/eafc_package.rs`.
#
# Separate from `build-check` on purpose — that workflow owns the engine, this one
# owns one generated mod, and a red package should not read as a red backend.

on:
  push:
    branches: [develop, "arena/**"]
    paths:
      - "mods/**"
      - "src-tauri/crates/ofm-cli/**"
      - "src-tauri/crates/ofm_core/src/generator/**"
      - "tools/eafc-import/**"
      - ".github/workflows/validate-eafc-package.yml"
  pull_request:
    paths:
      - "mods/**"
      - "src-tauri/crates/ofm-cli/**"
      - "src-tauri/crates/ofm_core/src/generator/**"
      - "tools/eafc-import/**"
      - ".github/workflows/validate-eafc-package.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-eafc-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Load the EA FC 27 package
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Test importer and audit source quality
        run: |
          node --test tools/eafc-import/lib/*.test.mjs
          node tools/eafc-import/audit.mjs mods/eafc-fc27

      - name: Checkout the recorded EA source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ViniMacacari/eafc-db-kit
          ref: 1464907bf4e726504d8b3ce15ffd0a552990565e
          path: .eafc-db-kit
          persist-credentials: false

      - name: Reproduce the corrected package from pinned source bytes
        run: |
          npm ci --prefix .eafc-db-kit
          node tools/eafc-import/import.mjs --kit .eafc-db-kit --out "$RUNNER_TEMP/eafc-rebuilt"
          for file in package.json teams.json players.json competitions.json; do
            cmp "mods/eafc-fc27/$file" "$RUNNER_TEMP/eafc-rebuilt/$file"
          done
          node tools/eafc-import/validate.mjs "$RUNNER_TEMP/eafc-rebuilt.ofm"
          node tools/eafc-import/audit.mjs "$RUNNER_TEMP/eafc-rebuilt.ofm"

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Cache the build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      # A compile error has to be readable without the log bundle, which is served
      # from a host not every environment can reach.
      - name: Build the authoring CLI
        run: |
          set +e
          cargo build --locked --manifest-path src-tauri/Cargo.toml -p ofm-cli \
            > "$RUNNER_TEMP/build.txt" 2>&1
          status=$?
          cat "$RUNNER_TEMP/build.txt"
          if [ "$status" -ne 0 ]; then
            grep -m 20 -E "^error" -A 4 "$RUNNER_TEMP/build.txt" |
              while IFS= read -r line; do echo "::error::build ${line}"; done
          fi
          exit "$status"

      # `build-check` lints this crate on every PR into develop, so the new test has
      # to pass the same two checks here rather than in someone else's pull request.
      - name: Lint the new test
        run: |
          set +e
          cargo fmt --manifest-path src-tauri/Cargo.toml -p ofm-cli -- --check \
            > "$RUNNER_TEMP/fmt.txt" 2>&1
          fmt_status=$?
          if [ "$fmt_status" -ne 0 ]; then
            head -40 "$RUNNER_TEMP/fmt.txt" |
              while IFS= read -r line; do echo "::error::fmt ${line}"; done
          fi
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml -p ofm-cli \
            --all-targets -- -D warnings > "$RUNNER_TEMP/clippy.txt" 2>&1
          clippy_status=$?
          if [ "$clippy_status" -ne 0 ]; then
            head -40 "$RUNNER_TEMP/clippy.txt" |
              while IFS= read -r line; do echo "::error::clippy ${line}"; done
          fi
          test "$fmt_status" -eq 0 -a "$clippy_status" -eq 0

      # `validate_package`: the same call the app makes before a mod is installed.
      #
      # The output is echoed as `::error::` annotations as well as to the log, so the
      # reason a package is rejected can be read from the check-run API without
      # downloading the log bundle.
      - name: Validate the package directory
        run: |
          set +e
          ./src-tauri/target/debug/ofm-cli validate mods/eafc-fc27 2>&1 | tee "$RUNNER_TEMP/validate.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -m 15 -E "error|Error|problem" "$RUNNER_TEMP/validate.log" |
              while IFS= read -r line; do echo "::error::${line//\%/}"; done
          fi
          exit "$status"

      # The archive is what a player installs, so it gets validated on its own.
      - name: Pack and validate the archive
        run: |
          ./src-tauri/target/debug/ofm-cli pack mods/eafc-fc27 --output "$RUNNER_TEMP/eafc-fc27.ofm"
          ./src-tauri/target/debug/ofm-cli validate "$RUNNER_TEMP/eafc-fc27.ofm"
          ls -lh "$RUNNER_TEMP/eafc-fc27.ofm"

      # The archive every build actually ships is written by scripts/pack-bundled-world.mjs, not
      # by `ofm-cli pack`: it runs on predev/prebuild, before any Rust toolchain is warm. So it is
      # validated here too — otherwise the zip the game defaults to would only ever be checked by
      # its own writer's tests, and a loader-side rejection would reach a player as a new career
      # that silently falls back to a generated world.
      - name: Validate the archive the game ships
        run: |
          set +e
          npm run world:pack
          ./src-tauri/target/debug/ofm-cli validate src-tauri/packages/eafc-fc27.ofm \
            2>&1 | tee "$RUNNER_TEMP/bundled.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -m 15 -E "error|Error|problem" "$RUNNER_TEMP/bundled.log" |
              while IFS= read -r line; do echo "::error::${line//\%/}"; done
          fi
          exit "$status"

      # The shipped archive must also survive the tracked-generated gate: committing it would
      # conflict on every data edit, which is why it is built rather than checked in.
      - name: Check the shipped archive is not tracked
        run: ./scripts/check-untracked-generated.sh

      # The load itself: `load_world_package` plus
      # `build_world_from_package_seeded`, asserting the world that comes out.
      - name: Build a world from the package
        run: |
          set +e
          cargo test --locked --manifest-path src-tauri/Cargo.toml \
            -p ofm-cli --test eafc_package -- --nocapture 2>&1 | tee "$RUNNER_TEMP/world.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -m 15 -E "panicked|assertion|left:|right:|error\[" "$RUNNER_TEMP/world.log" |
              while IFS= read -r line; do echo "::error::${line//\%/}"; done
          fi
          exit "$status"
